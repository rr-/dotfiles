[tool.black]
line-length = 79

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["authenticator", "launcher"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_subclassing_any = false

[project]
name = "libdotfiles"
version = "0.1.0"
description = "Shared helpers for dotfiles installers and scripts"
requires-python = ">=3.13"
dependencies = []
readme = "README.md"
authors = [
    {name = "Dash", email = "dash@bad.pink"}
]

[project.optional-dependencies]
color = ["coloredlogs>=15.0.1"]

[tool.setuptools]
packages = ["libdotfiles"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
