[tool.ruff]
line-length = 79
target-version = "py313"
extend-include = ["bin/util/aes-edit"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["authenticator", "launcher"]

[tool.ty.environment]
root = ["."]

[tool.ty.src]
include = ["libdotfiles", "tests", "bin/util/aes-edit"]

[project]
name = "libdotfiles"
version = "0.1.0"
description = "Shared helpers for dotfiles installers and scripts"
requires-python = ">=3.13"
dependencies = []
readme = "README.md"
authors = [
    {name = "Dash", email = "dash@bad.pink"}
]

[project.optional-dependencies]
color = ["coloredlogs>=15.0.1"]
dev = [
    "ruff==0.17.5",
    "ty==0.0.105",
    "coloredlogs>=15.0.1",
    "pycryptodome>=3.20",
]

[tool.setuptools]
packages = ["libdotfiles"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
