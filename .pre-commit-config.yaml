default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
  hooks:
  - id: ruff-check
    args: [--fix]
    types: [file]
    types_or: []
    files: '(\.pyi?$|^bin/util/aes-edit$)'
  - id: ruff-format
    types: [file]
    types_or: []
    files: '(\.pyi?$|^bin/util/aes-edit$)'

- repo: local
  hooks:
  - id: ty
    name: Type check installer helpers and tests
    entry: ty check libdotfiles tests bin/util/aes-edit
    language: python
    additional_dependencies: [ty==0.0.105, coloredlogs==15.0.1, pycryptodome==4.6.0]
    pass_filenames: false
    types: [file]
    files: '(\.pyi?$|^bin/util/aes-edit$|(^|/)pyproject\.toml$)'
  - id: commit-msg-50-72
    name: Commit message 50/72 rule
    entry: python3 tools/check_commit_msg
    language: system
    stages: [commit-msg]
  - id: uv-pins
    name: Pin the dependencies of uv scripts
    entry: python3 tools/check_uv_pins
    language: system
    types: [text]
