[project]
name = "libdotfiles"
version = "0.1.0"
description = "Shared helpers for dotfiles installers and scripts"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
color = ["coloredlogs>=15.0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["libdotfiles"]

[tool.setuptools.package-dir]
libdotfiles = "."
