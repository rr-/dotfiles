# What each color is FOR; cfg/wezterm/colors says what it is.
#
# A value is a palette index, a literal "#rrggbb", or "fg"/"bg". Where the
# themes were tuned apart, give each, and `attrs` rides along:
#
#     comment = { light = "#6F8F3A", dark = "#9DBF63" }
#     default = { value = 145, attrs = ["bold"] }
#
# light-hc is the light theme in black and white, for an e-ink screen. Where it
# isn't named it takes light's spec, through its own palette - which turns an
# index black or white, but leaves a literal "#rrggbb" alone, so every literal
# names a light-hc of its own. Anything a background is white there, anything
# drawn on one black, and what a shade of gray would have set apart is set
# apart by `reverse` instead:
#
#     raised = { value = 235, attrs = { light-hc = ["reverse"] } }
#
# No program names here - add a tone and let the template pick it.

# foreground tones, strongest to faintest
[text]
strong = 255
bright = 15
normal = "fg"
muted = 7
dim = 250
faint = 242
inverse = 232
# fainter still, for what only frames the text: line numbers, borders
ghost = { value = 238, light-hc = "fg" }
# the row you're on in a list, and the matches in it
selected = { value = 255, light-hc = "bg" }
selected_match = { value = 203, light-hc = "bg", attrs = { light-hc = ["bold", "underline"] } }

# background tones, deepest to closest to the surface
[surface]
sunken = { value = 232, attrs = { light-hc = ["reverse"] } }
base = 234
raised = { value = 235, attrs = { light-hc = ["reverse"] } }
# white on light-hc: tmux paints its window list on it
overlay = { value = 238, light-hc = "bg", attrs = { light-hc = ["reverse"] } }
# behind the row you're on in a list
selected = { value = 235, light-hc = "fg" }
border = { value = 234, light-hc = "fg" }
# behind the active pane's border. Elsewhere that is just the ground, but on
# light-hc a heavier line alone is hard to tell from the others
border_active = { value = "bg", light-hc = "#FF8800" }
# the terminal's own default background, for whoever has to paint it in its place
ground = "bg"

[accent]
primary = 39    # the thing you're on: active border, selection
bright = 75     # a lighter primary, for constants and one of the hosts
info = 110      # supporting detail: pane titles, docstrings
link = 14       # branches, urls, anything you'd follow

[state]
error = { value = 203, attrs = { light-hc = ["bold", "underline"] } }
warning = 173
success = 150
success_bg = { value = 150, light-hc = "bg" }
# muted backgrounds to lay behind a whole line
error_bg = 52
attention_bg = 58
info_bg = 23
# the gold Claude Code uses for "auto mode on", turned down
warning_dim = { light = "#8A7220", dark = "#8A7220", light-hc = "fg" }

[diff]
whitespace = 4

[diff.add]
fg = "fg"
bg = 64
# the changed words within a changed line, and a diff already dealt with
emph = 70
quiet = 22
accent = 10

[diff.del]
fg = "fg"
bg = 130
emph = { value = 166, light-hc = "bg" }
quiet = 94
accent = 9

[diff.meta]
fg = 255
bg = 234

[diff.frag]
fg = 255
bg = 23

# what kind of thing a file is
[file]
dir = 4
link = 14
executable = 10
archive = 9
media = 13
broken = 203
special = 11

# who you're talking to. These are identities rather than tones, which is why
# three of them are the same on both themes - they were picked by hand.
[host]
default = { value = 145, attrs = ["bold"] }
drizzle = 75
oldcastle = { value = 150, attrs = ["bold"] }
snowflake = { value = "#00DDDD", light-hc = "fg" }
lightning = { value = "#FFAA00", light-hc = "fg" }
nebula = { value = "#FF99EE", light-hc = "fg" }

# the second half of a two-tone host name, where it has one
[host2]
snowflake = { value = "#00AADD", light-hc = "fg" }
lightning = { value = "#EE8800", light-hc = "fg" }
nebula = { value = "#DD77DD", light-hc = "fg" }

[syntax]
comment = { light = "#6F8F3A", dark = "#9DBF63", light-hc = "fg" }
doc = 242
string = { light = "#5FAF00", dark = "#99FF66", light-hc = "fg" }
string_bg = { light = "#F8FFF0", dark = "#0A1004", light-hc = "bg" }
character = { light = "#5FAF00", dark = "#99FF66", light-hc = "fg" }
number = { light = "#D78000", dark = "#E0A040", light-hc = "fg" }
number_alt = { light = "#ff0000", dark = "#FF5555", light-hc = "fg" }
constant = 75
constant_alt = 174
keyword = 203
statement = 167
type = 146
type_alt = { light = "#408000", dark = "#8FBF40", light-hc = "fg" }
preproc = 4
identifier = 252
function = 15
special_key = 167
error_fg = { value = "#ffffff", light-hc = "bg" }
error_bg = { value = "#FF0000", light-hc = "fg" }

[editor]
cursor_fg = { value = "#FFFFFF", light-hc = "bg" }
# the one color light-hc keeps, since a black caret gets lost in black text
cursor_bg = { value = "#40AF40", light-hc = "#FF0000" }
cursorline = { light = "#F4F8EA", dark = "#0F140A", light-hc = "bg" }
search_bg = { value = 142, attrs = { light-hc = ["reverse"] } }
folded_bg = 233
function_bg = 233
function_fg = 111

# the desktop's glass panes, sampled off the wallpaper. Nothing in a terminal
# reads these - they exist so the panel, window frames and browser chrome can
# be their own thing without dragging the editor's colors along.
[pane]
film = { light = "#67A6E5", dark = "#0E1A33", light-hc = "bg" }
film_deep = { light = "#5293D0", dark = "#16233F", light-hc = "bg" }
edge = { light = "#2E67A4", dark = "#3E5885", light-hc = "fg" }
ink = { light = "#EAF3FB", dark = "#DCEAFC", light-hc = "fg" }
ink_faint = { light = "#5F7FBE", dark = "#7FA3E4", light-hc = "fg" }
accent = { light = "#0A4276", dark = "#78A8F8", light-hc = "fg" }
hot = { light = "#B33FA0", dark = "#EEB7F0", light-hc = "fg" }
