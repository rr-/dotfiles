# The XFCE session's compositor. bspwm keeps cfg/xorg/picom.conf, which stays
# lean; this one exists for the glass bezel cfg/theme/xfwm.py draws.
#
# xfwm4's own compositor is turned off (cfg/xfce/__main__.py) because it has
# no blur. picom does the blending here rather than the theme images: xfwm4
# treats alpha in a theme PNG as a cutout, so the frames are drawn opaque and
# frame-opacity makes them glass.

backend = "glx";
vsync = true;

frame-opacity = 0.62;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;

shadow = false;
fading = false;

blur-background-exclude = [
    "window_type = 'desktop'"
];

# considered these windows always focused (so not dimmed and such)
focus-exclude = [
    "class_g = 'mpv'"
];
