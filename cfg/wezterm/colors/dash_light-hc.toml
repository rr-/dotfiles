# The light theme, snapped to black and white for an e-ink screen: every
# color in dash_light.toml under half luminance is black here, every brighter
# one is white. ANSI 1-15 are all black, because whatever paints with them
# means them as text; only ANSI 0 is the background.
[colors]
background = "#FFFFFF"
foreground = "#000000"
# wezterm's own defaults are a green cursor and a lavender selection, which an
# e-ink screen can't show; OSC 112 puts the cursor back to this one
cursor_bg = "#FF0000"
cursor_fg = "#FFFFFF"
cursor_border = "#FF0000"
selection_bg = "#000000"
selection_fg = "#FFFFFF"
split = "#000000"

ansi = [
    "#FFFFFF",
    "#000000",
    "#000000",
    "#000000",
    "#000000",
    "#000000",
    "#000000",
    "#000000",
]
brights = [
    "#000000",
    "#000000",
    "#000000",
    "#000000",
    "#000000",
    "#000000",
    "#000000",
    "#000000",
]

