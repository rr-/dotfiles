defaults: &defaults
  exclude: &defaults_exclude
  - "*.pyc"
  - "__pycache__/"
  - ".mypy_cache/"
  - ".pytest_cache/"
  - ".ipython/"
  - "node_modules/"
  - "python_modules/"
  - "pgdata/"

items:
  - source: fw:/home/dash/
    target: frost:data/backup/fw/
    exclude: !flatten
    - *defaults_exclude
    - "/home/dash/.cache/"

  - source: nebula:/home/dash/
    target: frost:data/backup/nebula/
    exclude: !flatten
    - *defaults_exclude
    - "/home/dash/.cache/"
